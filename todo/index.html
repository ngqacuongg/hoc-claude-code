<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Việc hôm nay</title>
<style>
  :root {
    --bg: #f6f5f1; --card: #ffffff; --text: #1f1f1c; --muted: #77756d;
    --line: #e4e2db; --accent: #2f6f5e; --accent-soft: #e2efe9; --danger: #b54a3c;
  }
  /* Tối: theo hệ thống, trừ khi người dùng chọn tay (data-theme trên <html>) */
  :root[data-theme=dark] {
    --bg: #161614; --card: #201f1c; --text: #ecebe6; --muted: #9a988f;
    --line: #33322d; --accent: #6fbfa6; --accent-soft: #24352f; --danger: #e07a6a;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme=light]) {
      --bg: #161614; --card: #201f1c; --text: #ecebe6; --muted: #9a988f;
      --line: #33322d; --accent: #6fbfa6; --accent-soft: #24352f; --danger: #e07a6a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 560px; margin: 0 auto; padding: 32px 16px 64px; }

  header { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  h1 { font-size: 22px; margin: 0; }
  .date { color: var(--muted); font-size: 14px; margin-top: 2px; }
  .nav { display: flex; gap: 4px; }
  button {
    font: inherit; color: inherit; background: var(--card); border: 1px solid var(--line);
    border-radius: 8px; padding: 6px 10px; cursor: pointer;
  }
  button:hover { border-color: var(--accent); }

  .progress { margin: 20px 0 8px; height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
  .progress > div { height: 100%; background: var(--accent); width: 0; transition: width .25s; }
  .stats { color: var(--muted); font-size: 14px; }

  form { display: flex; gap: 8px; margin: 20px 0 12px; }
  input[type=text] {
    flex: 1; font: inherit; color: inherit; background: var(--card);
    border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px;
  }
  input[type=text]:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  form button { background: var(--accent); color: var(--bg); border-color: var(--accent); padding: 0 16px; }

  .carry {
    display: none; align-items: center; justify-content: space-between; gap: 8px;
    background: var(--accent-soft); border-radius: 8px; padding: 10px 12px; font-size: 14px; margin-bottom: 12px;
  }
  .carry.show { display: flex; }

  ul { list-style: none; margin: 0; padding: 0; background: var(--card); border: 1px solid var(--line); border-radius: 10px; }
  li { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-top: 1px solid var(--line); }
  li:first-child { border-top: none; }
  li input { width: 18px; height: 18px; accent-color: var(--accent); flex: none; }
  li span { flex: 1; overflow-wrap: anywhere; }
  li.done span { color: var(--muted); text-decoration: line-through; }
  li .del, li .edit { border: none; background: none; color: var(--muted); padding: 2px 6px; opacity: 0; }
  li:hover .del, li .del:focus, li:hover .edit, li .edit:focus { opacity: 1; }
  li .del:hover { color: var(--danger); }
  li .edit:hover { color: var(--accent); }
  @media (hover: none) { li .del, li .edit { opacity: 1; } }
  li input.editing { flex: 1; width: auto; height: auto; padding: 4px 8px; }
  footer { display: flex; gap: 8px; justify-content: center; margin-top: 24px; font-size: 14px; }
  footer button { color: var(--muted); }
  .empty { padding: 24px; text-align: center; color: var(--muted); }
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1 id="title">Hôm nay</h1>
      <div class="date" id="date"></div>
    </div>
    <div class="nav">
      <button id="prev" aria-label="Ngày trước">‹</button>
      <button id="today">Hôm nay</button>
      <button id="next" aria-label="Ngày sau">›</button>
      <button id="theme" aria-label="Đổi giao diện"></button>
    </div>
  </header>

  <div class="progress"><div id="bar"></div></div>
  <div class="stats" id="stats"></div>

  <form id="form">
    <input type="text" id="input" placeholder="Thêm việc cần làm…" autocomplete="off" required>
    <button type="submit">Thêm</button>
  </form>

  <div class="carry" id="carry">
    <span id="carryText"></span>
    <button id="carryBtn">Chuyển sang</button>
  </div>

  <ul id="list"></ul>

  <footer>
    <button id="export">Xuất dữ liệu (JSON)</button>
    <button id="import">Nhập dữ liệu</button>
    <input type="file" id="file" accept="application/json,.json" hidden>
  </footer>
</main>

<script>
// Dữ liệu lưu trong localStorage: { "2026-11-04": [{id, text, done}], ... }
const KEY = 'daily-todo-v1';
let data = load();
let current = todayKey();

function load() {
  try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch { return {}; }
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(data)); } catch {}
}
function keyOf(d) {
  const p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
}
function todayKey() { return keyOf(new Date()); }
function shift(key, days) {
  const [y, m, d] = key.split('-').map(Number);
  return keyOf(new Date(y, m - 1, d + days));
}
function tasks(key) { return data[key] || (data[key] = []); }

// Ngày gần nhất trước `key` còn việc chưa xong
function lastUnfinished(key) {
  return Object.keys(data).filter(k => k < key && data[k].some(t => !t.done)).sort().pop();
}

function render() {
  const [y, m, d] = current.split('-').map(Number);
  const date = new Date(y, m - 1, d);
  const t0 = todayKey();
  document.getElementById('title').textContent =
    current === t0 ? 'Hôm nay' : current === shift(t0, -1) ? 'Hôm qua'
    : current === shift(t0, 1) ? 'Ngày mai' : 'Việc trong ngày';
  document.getElementById('date').textContent =
    date.toLocaleDateString('vi-VN', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });

  const list = tasks(current);
  const done = list.filter(t => t.done).length;
  document.getElementById('bar').style.width = list.length ? (done / list.length * 100) + '%' : '0';
  document.getElementById('stats').textContent =
    list.length ? `Đã xong ${done}/${list.length} việc` + (done === list.length ? ' 🎉' : '') : 'Chưa có việc nào';

  const ul = document.getElementById('list');
  ul.innerHTML = '';
  if (!list.length) {
    ul.innerHTML = '<li class="empty">Thêm việc đầu tiên ở ô phía trên.</li>';
  }
  // Việc chưa xong lên trước
  [...list].sort((a, b) => a.done - b.done).forEach(t => {
    const li = document.createElement('li');
    li.className = t.done ? 'done' : '';
    li.innerHTML = `<input type="checkbox" ${t.done ? 'checked' : ''} aria-label="Đánh dấu xong"><span></span>
                    <button class="edit" aria-label="Sửa">✎</button>
                    <button class="del" aria-label="Xoá">✕</button>`;
    const span = li.querySelector('span');
    span.textContent = t.text;
    span.ondblclick = li.querySelector('.edit').onclick = () => startEdit(li, span, t);
    li.querySelector('input').onchange = () => { t.done = !t.done; save(); render(); };
    li.querySelector('.del').onclick = () => {
      data[current] = list.filter(x => x.id !== t.id); save(); render();
    };
    ul.appendChild(li);
  });

  // Gợi ý chuyển việc chưa xong từ ngày trước sang hôm nay
  const carry = document.getElementById('carry');
  const from = current === todayKey() ? lastUnfinished(current) : null;
  if (from) {
    const n = data[from].filter(t => !t.done).length;
    const [fy, fm, fd] = from.split('-');
    document.getElementById('carryText').textContent = `Còn ${n} việc chưa xong từ ngày ${+fd}/${+fm}.`;
    document.getElementById('carryBtn').onclick = () => {
      const left = data[from].filter(t => !t.done);
      data[from] = data[from].filter(t => t.done);
      tasks(current).push(...left);
      save(); render();
    };
    carry.classList.add('show');
  } else {
    carry.classList.remove('show');
  }
}

// Sửa việc: thay <span> bằng ô nhập. Enter hoặc bấm ra ngoài thì lưu, Esc thì huỷ.
function startEdit(li, span, t) {
  const input = document.createElement('input');
  input.type = 'text';
  input.className = 'editing';
  input.value = t.text;
  span.replaceWith(input);
  input.focus();
  input.select();
  let finished = false;
  const finish = keep => {
    if (finished) return;
    finished = true;
    const text = input.value.trim();
    if (keep && text) { t.text = text; save(); }
    render();
  };
  input.onkeydown = e => {
    if (e.key === 'Enter') finish(true);
    if (e.key === 'Escape') finish(false);
  };
  input.onblur = () => finish(true);
}

// Giao diện: auto (theo hệ thống) → sáng → tối → auto. Lưu ở khoá riêng.
const THEME_KEY = 'daily-todo-theme';
const THEMES = { auto: '◐ Tự động', light: '☀ Sáng', dark: '☾ Tối' };
let theme = 'auto';
try { theme = localStorage.getItem(THEME_KEY) || 'auto'; } catch {}
function applyTheme() {
  if (theme === 'auto') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.dataset.theme = theme;
  document.getElementById('theme').textContent = THEMES[theme] || THEMES.auto;
}
document.getElementById('theme').onclick = () => {
  const order = Object.keys(THEMES);
  theme = order[(order.indexOf(theme) + 1) % order.length];
  try { localStorage.setItem(THEME_KEY, theme); } catch {}
  applyTheme();
};
applyTheme();

// Xuất: tải toàn bộ dữ liệu về một file JSON để sao lưu.
document.getElementById('export').onclick = () => {
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `todo-${todayKey()}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
};
// Nhập: gộp vào dữ liệu hiện có, bỏ qua việc trùng id, nên nhập lại cùng file không bị nhân đôi.
document.getElementById('import').onclick = () => document.getElementById('file').click();
document.getElementById('file').onchange = async e => {
  const file = e.target.files[0];
  e.target.value = '';
  if (!file) return;
  try {
    const incoming = JSON.parse(await file.text());
    if (!incoming || typeof incoming !== 'object' || Array.isArray(incoming)) throw 0;
    let added = 0;
    for (const [day, list] of Object.entries(incoming)) {
      if (!/^\d{4}-\d{2}-\d{2}$/.test(day) || !Array.isArray(list)) continue;
      const ids = new Set(tasks(day).map(t => t.id));
      for (const t of list) {
        if (!t || typeof t.text !== 'string' || ids.has(t.id)) continue;
        tasks(day).push({ id: t.id ?? Date.now() + Math.random(), text: t.text, done: !!t.done });
        added++;
      }
    }
    save(); render();
    alert(`Đã nhập ${added} việc.`);
  } catch {
    alert('File không đúng định dạng dữ liệu todo.');
  }
};

document.getElementById('form').onsubmit = e => {
  e.preventDefault();
  const input = document.getElementById('input');
  const text = input.value.trim();
  if (!text) return;
  tasks(current).push({ id: Date.now() + Math.random(), text, done: false });
  input.value = '';
  save(); render();
};
document.getElementById('prev').onclick = () => { current = shift(current, -1); render(); };
document.getElementById('next').onclick = () => { current = shift(current, 1); render(); };
document.getElementById('today').onclick = () => { current = todayKey(); render(); };

render();
</script>
</body>
</html>
