<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nguyễn Quốc Anh Cường</title>
<meta name="description" content="Nguyen Quoc Anh Cuong: neuroscience & biohealth, research, teaching and the tools I build.">
<meta property="og:title" content="Nguyễn Quốc Anh Cường">
<meta property="og:description" content="From the lab bench to the brain: research, teaching and the tools I build.">
<!-- Font có đủ dấu tiếng Việt; Iowan/Georgia trên máy hiện sai dấu chữ ư, ơ -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;800;900&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f5f1; --card: #ffffff; --text: #1f1f1c; --muted: #6f6d66;
    --line: #e4e2db; --accent: #2f6f5e; --accent-soft: #e2efe9; --warm: #b8673a; --warm-soft: #f6e8de;
    --serif: "Lora", "Times New Roman", serif;
    --sans: "Be Vietnam Pro", -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  :root { --dot: rgba(0,0,0,.07); }
  :root[data-theme="dark"] {
    --bg: #0b0c0d; --card: #141617; --text: #eef0ec; --muted: #8e938e;
    --line: #23272a; --accent: #6fcfae; --accent-soft: #15302a; --warm: #e8a070; --warm-soft: #33241b; --dot: rgba(255,255,255,.055);
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; scroll-padding-top: 64px; }
  body { margin: 0; background: var(--bg) radial-gradient(var(--dot) 1px, transparent 1px) 0 0 / 22px 22px; color: var(--text); font: 16px/1.65 var(--sans); -webkit-font-smoothing: antialiased; }
  a { color: inherit; }
  .wrap { max-width: 960px; margin: 0 auto; padding: 0 20px; }
  em { font-style: italic; color: var(--accent); }

  /* thanh trên cùng */
  #progress { position: fixed; top: 0; left: 0; height: 3px; width: 0; background: var(--accent); z-index: 30; }
  nav { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--bg) 82%, transparent);
        backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
  nav .wrap { display: flex; align-items: center; gap: 8px; height: 56px; }
  .logo { font: 600 15px var(--mono); text-decoration: none; margin-right: auto; }
  .logo b { color: var(--accent); }
  #chapterNow { font: 13px var(--mono); color: var(--muted); }
  .icon-btn { font: 600 13px var(--mono); color: var(--muted); background: none; border: 1px solid var(--line);
              border-radius: 8px; min-width: 36px; height: 34px; padding: 0 8px; cursor: pointer; }
  .nav-cv { padding: 7px 12px; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; background: transparent; }
  @media (max-width: 560px) { nav .nav-cv { display: none; } }   /* "nav" để thắng quy tắc .btn viết phía sau */
  .nav-cta { padding: 7px 14px; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; margin-left: 4px; }
  @media (max-width: 420px) { nav .nav-cta { display: none; } }
  .icon-btn:hover { color: var(--text); border-color: var(--accent); }
  @media (max-width: 560px) { #chapterNow { display: none; } }

  /* thanh chương bên phải (desktop) */
  #rail { position: fixed; right: 22px; top: 50%; transform: translateY(-50%); z-index: 15;
          display: flex; flex-direction: column; gap: 14px; }
  #rail a { position: relative; display: block; width: 10px; height: 10px; border-radius: 50%;
            border: 2px solid var(--muted); opacity: .55; transition: .25s; }
  #rail a.on { background: var(--accent); border-color: var(--accent); opacity: 1; transform: scale(1.3); }
  #rail a span { position: absolute; right: 20px; top: 50%; transform: translateY(-50%); white-space: nowrap;
                 font: 12px var(--mono); color: var(--text); background: var(--card); border: 1px solid var(--line);
                 padding: 2px 8px; border-radius: 6px; opacity: 0; pointer-events: none; transition: .2s; }
  #rail a:hover span { opacity: 1; }
  @media (max-width: 1100px) { #rail { display: none; } }

  /* mở đầu */
  header.hero { position: relative; min-height: min(92vh, 820px); display: flex; align-items: center; overflow: hidden;
                border-bottom: 1px solid var(--line); }
  #net { position: absolute; inset: 0; width: 100%; height: 100%; }
  .hero .wrap { position: relative; width: 100%; padding-top: 60px; padding-bottom: 60px; pointer-events: none; }
  .hero .wrap a, .hero .wrap button { pointer-events: auto; }
  .pill { display: inline-flex; align-items: center; gap: 8px; font: 13px var(--mono); color: var(--muted);
          border: 1px solid var(--line); border-radius: 99px; padding: 4px 12px; background: var(--card); }
  .pill i { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); animation: pulse 2s infinite; }
  @keyframes pulse { 50% { opacity: .3; } }
  h1 { font: 400 clamp(42px, 8vw, 88px)/1 var(--serif); letter-spacing: -.025em; margin: 22px 0 0; }
  .hero-kicker { margin: 26px 0 0; font: 600 13px var(--mono); letter-spacing: .18em; text-transform: uppercase; color: var(--accent); }
  .mega { font: 900 clamp(44px, 10.5vw, 112px)/1.06 var(--sans);   /* đủ chỗ cho dấu tiếng Việt trên chữ in hoa */ letter-spacing: -.035em; text-transform: uppercase; margin: 16px 0 0; }
  .mega span { display: block; }
  .mega .hl { color: var(--accent); }
  .roles { margin: 22px 0 0; font: 500 13px var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  .btn.ghost { background: transparent; }
  h1 small { display: block; font: 400 clamp(16px, 2vw, 20px) var(--mono); color: var(--muted); letter-spacing: 0; margin-bottom: 14px; }
  .lead { font: 400 clamp(18px, 2.2vw, 22px)/1.5 var(--serif); max-width: 640px; margin: 18px 0 0; color: var(--muted); }
  .interests { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 26px; }
  .interests span { font-size: 14px; background: var(--card); border: 1px solid var(--line); border-radius: 99px; padding: 5px 14px; }
  .cta { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 30px; }
  .btn { display: inline-flex; align-items: center; gap: 8px; text-decoration: none; font: 500 15px var(--sans);
         padding: 10px 18px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--text); cursor: pointer; }
  .btn:hover { border-color: var(--accent); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--bg); }
  .scroll-hint { position: absolute; bottom: 22px; left: 50%; transform: translateX(-50%); font: 12px var(--mono);
                 color: var(--muted); animation: bob 2s infinite; }
  @keyframes bob { 50% { transform: translate(-50%, 6px); } }

  /* chương */
  section { padding: 84px 0; border-bottom: 1px solid var(--line); }
  .kicker { font: 600 12px var(--mono); color: var(--accent); letter-spacing: .18em; text-transform: uppercase; }
  h2 { font: 800 clamp(30px, 4.6vw, 48px)/1.08 var(--sans); margin: 10px 0 12px; letter-spacing: -.025em; }
  .intro { color: var(--muted); font-size: 17px; max-width: 620px; margin: 0 0 36px; }
  .next { display: inline-flex; gap: 10px; align-items: baseline; margin-top: 44px; text-decoration: none;
          color: var(--muted); font: 14px var(--mono); }
  .next b { font: 400 22px var(--serif); color: var(--text); }
  .next:hover b { color: var(--accent); }

  /* tiểu sử */
  .highlights { list-style: none; margin: 0 0 44px; padding: 0; display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
  .highlights li { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; font-size: 13px; color: var(--muted); line-height: 1.35; }
  .highlights b { display: block; font: 900 34px/1 var(--sans); color: var(--text); margin-bottom: 6px; letter-spacing: -.02em; }
  @media (max-width: 860px) { .highlights { grid-template-columns: repeat(3, 1fr); } }
  @media (max-width: 480px) { .highlights { grid-template-columns: repeat(2, 1fr); } }
  .roles-title { margin-top: 8px; }
  .roles-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 48px; }
  @media (max-width: 860px) { .roles-grid { grid-template-columns: 1fr; } }
  .role { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 20px; display: flex; flex-direction: column; transition: border-color .25s, transform .25s; }
  .role:hover { border-color: var(--accent); transform: translateY(-3px); }
  .role-n { font: 600 12px var(--mono); color: var(--accent); letter-spacing: .14em; }
  .role h4 { margin: 8px 0 8px; font: 800 20px/1.2 var(--sans); text-transform: uppercase; letter-spacing: -.01em; }
  .role p { margin: 0 0 16px; color: var(--muted); font-size: 15px; flex: 1; }
  .bio-lead { font: 400 clamp(20px, 2.6vw, 26px)/1.45 var(--serif); max-width: 760px; margin: 0 0 40px; }
  .about { display: grid; grid-template-columns: 1.5fr 1fr; gap: 44px; }
  .story { list-style: none; margin: 0; padding: 0; counter-reset: s; }
  .story li { counter-increment: s; display: grid; grid-template-columns: 46px 1fr; gap: 4px 10px; padding: 0 0 26px; position: relative; }
  .story li::before { content: counter(s); grid-row: span 2; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center;
                      font: 400 17px var(--serif); color: var(--accent); background: var(--accent-soft); z-index: 1; }
  .story li:not(:last-child)::after { content: ""; position: absolute; left: 16px; top: 34px; bottom: 0; width: 2px; background: var(--line); }
  .story h4 { margin: 4px 0 0; font: 600 17px var(--sans); }
  .story p { margin: 0; grid-column: 2; color: var(--muted); font-size: 16px; }
  .side { display: grid; gap: 16px; align-self: start; }
  .goal { background: var(--accent); color: var(--bg); border-radius: 14px; padding: 18px; }
  .goal small { display: block; font: 12px var(--mono); opacity: .8; text-transform: uppercase; letter-spacing: .05em; margin-bottom: 6px; }
  .goal p { margin: 0; font: 400 18px/1.45 var(--serif); }
  .facts { list-style: none; margin: 0; padding: 0; border: 1px solid var(--line); border-radius: 14px; background: var(--card); }
  .facts li { padding: 12px 16px; border-top: 1px solid var(--line); font-size: 15px; }
  .facts li:first-child { border-top: none; }
  .facts small { display: block; font: 12px var(--mono); color: var(--muted); }
  @media (max-width: 720px) { .about { grid-template-columns: 1fr; gap: 20px; } }

  /* hành trình: timeline dọc */
  .vline { list-style: none; margin: 0; padding: 0 0 0 28px; position: relative; }
  .vline::before { content: ""; position: absolute; left: 7px; top: 10px; bottom: 10px; width: 2px; background: var(--line); }
  .vt { position: relative; margin-bottom: 12px; }
  .vt::before { content: ""; position: absolute; left: -28px; top: 20px; width: 16px; height: 16px; border-radius: 50%;
                background: var(--bg); border: 3px solid var(--dot); box-sizing: border-box; z-index: 1; }
  .vt.now::before { background: var(--dot); box-shadow: 0 0 0 0 var(--dot); animation: ring 2s infinite; }
  .vt.upnext::before { border-style: dashed; }
  @keyframes ring { 70% { box-shadow: 0 0 0 9px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }
  .vt details { background: var(--card); border: 1px solid var(--line); border-left: 3px solid var(--dot); border-radius: 14px; transition: border-color .2s; }
  .vt details:hover, .vt details[open] { border-color: var(--dot); }
  .vt summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: 120px 1fr auto; gap: 14px; align-items: start; padding: 16px 18px; }
  .vt summary::-webkit-details-marker { display: none; }
  .vt-date { font: 12px var(--mono); color: var(--muted); padding-top: 3px; white-space: nowrap; }
  .vt-kind { display: block; font: 600 11px var(--mono); color: var(--dot); text-transform: uppercase; letter-spacing: .12em; }
  .vt-head b { display: block; font: 700 17px/1.3 var(--sans); margin-top: 2px; }
  .vt-head small { display: block; color: var(--muted); font-size: 14px; margin-top: 2px; }
  .vt-count { display: flex; align-items: center; gap: 10px; font: 12px var(--mono); color: var(--muted); white-space: nowrap; padding-top: 2px; }
  .vt-count i { font-style: normal; font-size: 18px; color: var(--dot); transition: transform .2s; }
  .vt details[open] .vt-count i { transform: rotate(45deg); }
  .vt-body { padding: 0 18px 18px 152px; }
  .vt-body ul { margin: 0; padding-left: 18px; font-size: 15px; }
  .vt-body li { margin-bottom: 4px; }
  .vt-items { margin: 16px 0 0; grid-template-columns: repeat(3, 1fr); }
  @media (max-width: 720px) {
    .vt summary { grid-template-columns: 1fr auto; } .vt-date { grid-column: 1 / -1; padding: 0; }
    .vt-body { padding-left: 18px; } .vt-items { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 440px) { .vt-items { grid-template-columns: 1fr; } }
  @media (prefers-reduced-motion: reduce) { .vt.now::before { animation: none; } }
  .alongside { display: grid; grid-template-columns: repeat(2, 1fr); gap: 4px 28px; margin: 0; padding: 0; list-style: none; }
  .alongside li { display: grid; grid-template-columns: 96px 1fr; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); font-size: 14px; }
  .alongside time { font: 12px var(--mono); color: var(--muted); padding-top: 2px; }
  @media (max-width: 720px) { .alongside { grid-template-columns: 1fr; } }

  /* nghiên cứu */
  .cols4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 40px; }
  @media (max-width: 860px) { .cols4 { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 480px) { .cols4 { grid-template-columns: 1fr; } }
  /* dự án & poster: lưới thẻ dùng chung */
  .gallery { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 40px; }
  @media (max-width: 860px) { .gallery { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 440px) { .gallery { grid-template-columns: 1fr; } }
  .pcard { display: flex; flex-direction: column; text-align: left; font: inherit; color: inherit; padding: 0; background: var(--card);
           border: 1px solid var(--line); border-radius: 14px; overflow: hidden; cursor: pointer; transition: transform .25s, border-color .25s, box-shadow .25s; }
  .pcard.static { cursor: default; }
  .pcard:not(.static):hover { transform: translateY(-4px); border-color: var(--accent); box-shadow: 0 14px 34px -22px var(--accent); }
  .pc-img { position: relative; display: block; aspect-ratio: 4 / 5; background: var(--accent-soft); overflow: hidden; border-bottom: 1px solid var(--line); }
  .pc-img img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; }
  .pcard[data-book] .pc-img { background: #d4fbc9; }                 /* bìa brochure hình vuông: hiện trọn, nền trùng màu bìa */
  .pcard[data-book] .pc-img img { object-fit: contain; object-position: center; }
  .pcard[data-cert] .pc-img { aspect-ratio: 4 / 3; background: #f4f2ec; }
  .pcard[data-cert] .pc-img img { object-fit: contain; object-position: center; }
  .pc-img .noimg { position: absolute; inset: 0; display: grid; place-items: center; font: 13px var(--mono); color: var(--muted); }
  .pc-tag { position: absolute; left: 10px; top: 10px; font: 11px var(--mono); color: #fff; background: rgba(0,0,0,.55); padding: 2px 8px; border-radius: 6px; }
  .pc-body { display: flex; flex-direction: column; gap: 4px; padding: 14px 16px 16px; flex: 1; }
  .pc-body b { font: 600 15px/1.4 var(--sans); }
  .pc-where { color: var(--muted); font-size: 13px; line-height: 1.45; }
  .pc-body .award { align-self: flex-start; }
  .pc-cta { margin-top: auto; padding-top: 8px; font-size: 14px; color: var(--accent); }
  /* cửa sổ brochure */
  #bookDlg { width: min(960px, 96vw); max-height: 94vh; overflow: auto; border: 1px solid var(--line); border-radius: 16px; background: var(--card); color: var(--text); padding: 20px 22px 22px; }
  #bookDlg::backdrop { background: rgba(0,0,0,.6); backdrop-filter: blur(3px); }
  .book-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  .book-head h4 { margin: 0; font: 400 22px/1.25 var(--serif); }
  .book-text { margin: 6px 0 4px; color: var(--muted); font-size: 14px; max-width: 760px; }
  .sheets { display: none; gap: 14px; padding: 14px 0 18px; }
  .sheets figure { margin: 0; }
  .sheets figcaption { font: 12px var(--mono); color: var(--muted); margin-top: 4px; }
  .book-stage[data-sheets="true"] .book-wrap { display: none; }
  .book-stage[data-sheets="true"] .sheets { display: grid; }
  /* brochure lật trang */
  .book-wrap { perspective: 2000px; overflow: hidden; padding: 14px 0 18px; }
  .book { position: relative; width: min(100%, 860px); aspect-ratio: 2 / 1; margin: 0 auto; transform-style: preserve-3d;
          transition: transform .7s cubic-bezier(.4, .1, .2, 1); }
  .book[data-at="0"] { transform: translateX(-25%); }               /* đang đóng: đưa bìa ra giữa */
  .book[data-end="true"] { transform: translateX(25%); }            /* lật hết: đưa trang cuối ra giữa */
  .leaf { position: absolute; top: 0; left: 50%; width: 50%; height: 100%; transform-origin: left center; transform-style: preserve-3d;
          transition: transform .7s cubic-bezier(.4, .1, .2, 1); cursor: pointer; }
  .leaf.flipped { transform: rotateY(-180deg); }
  .face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden;
          background-size: 400% 100%; background-repeat: no-repeat; background-color: #e9f5e4;
          box-shadow: 0 6px 22px -10px rgba(0,0,0,.45), inset 0 0 0 1px rgba(0,0,0,.06); }
  .face.front { border-radius: 0 8px 8px 0; }
  .face.back { transform: rotateY(180deg); border-radius: 8px 0 0 8px; }
  .face::after { content: ""; position: absolute; top: 0; bottom: 0; width: 9%; pointer-events: none; }     /* bóng ở gáy sách */
  .face.front::after { left: 0; background: linear-gradient(to right, rgba(0,0,0,.16), transparent); }
  .face.back::after { right: 0; background: linear-gradient(to left, rgba(0,0,0,.16), transparent); }
  .book-nav { display: flex; align-items: center; justify-content: center; gap: 16px; font: 13px var(--mono); color: var(--muted); text-align: center; }
  .book-nav button { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; cursor: pointer; white-space: nowrap; }
  .book-nav button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  .book-nav button:disabled { opacity: .35; cursor: default; }
  @media (prefers-reduced-motion: reduce) { .book, .leaf { transition: none; } }
  .zoom { display: block; width: 100%; padding: 0; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: none; cursor: zoom-in; }
  .zoom img { display: block; width: 100%; height: auto; transition: transform .3s; }
  .zoom:hover { border-color: var(--accent); }
  .zoom:hover img { transform: scale(1.02); }
  #lb { padding: 0; border: 0; background: none; max-width: 96vw; max-height: 94vh; overflow: auto; cursor: zoom-out; border-radius: 10px; }
  #lb::backdrop { background: rgba(0,0,0,.8); }
  #lb img { display: block; max-width: min(1200px, 96vw); height: auto; }
  #lb img.wide { max-width: none; height: min(900px, 86vh); width: auto; }   /* tờ brochure rất dài: cho cuộn ngang để đọc được chữ */
  .interest { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 20px; }
  .interest .n { font: 400 36px/1 var(--serif); color: var(--accent); }
  .interest p { margin: 10px 0 0; font-size: 15px; }
  h3.sub { font: 13px var(--mono); color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin: 0 0 14px; }
  .award { display: inline-block; margin-top: 6px; font: 12px var(--mono); color: var(--warm); background: var(--warm-soft); padding: 2px 8px; border-radius: 6px; }
  .studies { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  @media (max-width: 720px) { .studies { grid-template-columns: 1fr; } }
  .study { border-left: 3px solid var(--accent); padding: 4px 0 4px 14px; font-size: 15px; }

  /* tác phẩm (artifact) */
  .works { display: grid; grid-template-columns: repeat(2, 1fr); gap: 18px; }
  @media (max-width: 720px) { .works { grid-template-columns: 1fr; } }
  .work { background: var(--card); border: 1px solid var(--line); border-radius: 16px; overflow: hidden;
          display: flex; flex-direction: column; transition: transform .25s, box-shadow .25s, border-color .25s; }
  .work:hover { transform: translateY(-4px); border-color: var(--accent); box-shadow: 0 14px 34px -22px var(--accent); }
  .cover { height: 132px; position: relative; display: flex; align-items: flex-end; padding: 14px 18px;
           background: var(--cover); color: #fff; }
  .cover .big { position: absolute; right: 14px; top: 6px; font-size: 64px; opacity: .9; filter: saturate(.9); }
  .cover .who { font: 12px var(--mono); background: rgba(0,0,0,.25); padding: 2px 8px; border-radius: 6px; }
  .work .body { padding: 18px; flex: 1; display: flex; flex-direction: column; }
  .work h4 { margin: 0 0 6px; font: 600 18px var(--sans); }
  .work p { margin: 0 0 14px; color: var(--muted); font-size: 15px; }
  .items { list-style: none; margin: auto 0 0; padding: 0; border-top: 1px solid var(--line); }

function ago(iso) {
  if (!iso) return "";
  const s = (new Date(iso) - Date.now()) / 1000, rtf = new Intl.RelativeTimeFormat(lang, { numeric: "auto" });
  for (const [u, n] of [["year", 31536000], ["month", 2592000], ["day", 86400], ["hour", 3600], ["minute", 60]])
    if (Math.abs(s) >= n) return rtf.format(Math.round(s / n), u);
  return rtf.format(0, "minute");
}
const repoMeta = (repo) => gh.repos[repo] ? `${t(UI.updated)} ${esc(ago(gh.repos[repo]))}` : "";

function liveHTML() {
  if (gh.state === "loading") return `<p class="muted">${t(UI.liveLoading)}</p>`;
  if (gh.state === "fail") return `<p class="muted">${t(UI.liveFail)} <a href="${ghUrl("")}" target="_blank" rel="noopener">github.com/${esc(ME.github)} ↗</a></p>`;
  const last = Object.values(gh.repos).sort().pop();
  return `<div class="gh-stats">
      <div><b>${gh.count}</b><span>${t(UI.repos)}</span></div>
      <div><b>${esc(ago(last))}</b><span>${t(UI.lastPush)}</span></div>
    </div>
    <ol class="commits">${gh.commits.map((c) => `<li><a href="${esc(c.url)}" target="_blank" rel="noopener">
      <code>${esc(c.sha)}</code><span>${esc(c.msg)}</span><time>${esc(ago(c.date))}</time></a></li>`).join("")}</ol>`;
}

// Gọi GitHub API công khai (không cần token, giới hạn 60 lần/giờ cho mỗi người xem),
// lưu tạm 30 phút để mỗi lần tải lại trang không phải gọi lại.
async function loadGitHub() {
  const KEY = "portfolio-gh";
  let cached = null; try { cached = JSON.parse(store.get(KEY)); } catch {}
  if (cached && Date.now() - cached.at < 30 * 60 * 1000) { gh = cached.data; return paintGitHub(); }
  try {
    const [repos, commits] = await Promise.all([
      fetch(`https://api.github.com/users/${ME.github}/repos?per_page=100`).then((r) => r.ok ? r.json() : Promise.reject(r.status)),
      fetch(`https://api.github.com/repos/${ME.github}/${REPO}/commits?per_page=6`).then((r) => r.ok ? r.json() : Promise.reject(r.status)),
    ]);
    gh = { state: "ok", count: repos.length,
      repos: Object.fromEntries(repos.map((r) => [r.name, r.pushed_at])),
      commits: commits.map((c) => ({ sha: c.sha.slice(0, 7), msg: c.commit.message.split("\n")[0], date: c.commit.author.date, url: c.html_url })) };
    store.set(KEY, JSON.stringify({ at: Date.now(), data: gh }));
  } catch { gh = { ...gh, state: "fail" }; }
  paintGitHub();
}
function paintGitHub() {
  const live = $("#ghLive"); if (live) live.innerHTML = liveHTML();
  document.querySelectorAll(".ago[data-repo]").forEach((el) => el.innerHTML = repoMeta(el.dataset.repo));
}

/* ---- Brochure lật trang ----

   khi lật, nó xoay 180° quanh gáy (mép trái) sang nửa trái. bookAt = số lá đã lật. */
let bookAt = 0;
const pageBg = (pg) => `background-image:url(${ME.nutrition.sheets[pg.sheet]});background-position:${pg.col / 3 * 100}% 0`;
function bookLabel() {
  const P = ME.nutrition.pages, n = P.length, a = bookAt * 2;          // a = số trang nằm bên trái gáy
  if (a > n) return t(UI.bothSides);
  const shown = bookAt === 0 ? [1] : a >= n ? [n] : [a, a + 1];
  return `${shown.join("–")} / ${n} · ${shown.map((k) => t(P[k - 1].name)).join(" · ")}`;
}
// Các trạng thái: 0 = đóng (bìa) … leaves = lật hết (trang cuối) … leaves + 1 = trải cả hai mặt giấy
function bookHTML() {
  const N = ME.nutrition, P = N.pages, leaves = P.length / 2;
  return `<div class="book-head"><h4>${t(N.title)}</h4><button class="icon-btn" data-close aria-label="${t(UI.close)}">✕</button></div>
    <p class="book-text">${t(N.text)}</p>
    <div class="book-stage" id="bookStage" data-sheets="false">
      <div class="book-wrap"><div class="book" id="book" data-at="0" data-end="false">
        ${Array.from({ length: leaves }, (_, i) => `<div class="leaf" data-leaf="${i}" style="z-index:${leaves - i}">
          <div class="face front" style="${pageBg(P[2 * i])}"></div><div class="face back" style="${pageBg(P[2 * i + 1])}"></div></div>`).join("")}
      </div></div>
      <div class="sheets">
        <figure><button class="zoom" data-zoom="${N.sheets.out}" data-wide="1"><img src="${N.sheets.out}" alt="${t(UI.sideOut)}"></button><figcaption>${t(UI.sideOut)}</figcaption></figure>
        <figure><button class="zoom" data-zoom="${N.sheets.in}" data-wide="1"><img src="${N.sheets.in}" alt="${t(UI.sideIn)}"></button><figcaption>${t(UI.sideIn)}</figcaption></figure>
      </div>
    </div>
    <div class="book-nav">
      <button data-flip="-1" disabled>${t(UI.prev)}</button>
      <span id="bookPos">${bookLabel()}</span>
      <button data-flip="1">${t(UI.nextStep)}</button>
    </div>`;
}
function openBook() { bookAt = 0; $("#bookBox").innerHTML = bookHTML(); $("#bookDlg").showModal(); }
function flipBook(dir) {
  const book = $("#book"), leaves = book.children.length, to = bookAt + dir;
  if (to < 0 || to > leaves + 1) return;
  if (to <= leaves && bookAt <= leaves) {                           // lật một lá
    const i = dir > 0 ? bookAt : bookAt - 1, leaf = book.children[i];
    leaf.style.zIndex = leaves + 1;                                 // lá đang lật luôn nằm trên cùng
    leaf.classList.toggle("flipped", dir > 0);
    setTimeout(() => { leaf.style.zIndex = dir > 0 ? i + 1 : leaves - i; }, 350);   // giữa chừng thì xếp lại thứ tự chồng
  }
  bookAt = to;
  book.dataset.at = Math.min(bookAt, leaves); book.dataset.end = bookAt >= leaves;
  $("#bookStage").dataset.sheets = bookAt > leaves;                 // qua trang cuối: trải cả hai mặt giấy
  $("#bookPos").innerHTML = bookLabel();
  document.querySelector('[data-flip="-1"]').disabled = bookAt === 0;
  document.querySelector('[data-flip="1"]').disabled = bookAt === leaves + 1;
}

// Hiện dần + đánh dấu chương đang đọc
let revealObs, chapObs;
function observe() {
  revealObs?.disconnect(); chapObs?.disconnect();
  revealObs = new IntersectionObserver((es) => es.forEach((e) => {
    if (e.isIntersecting) { e.target.classList.add("in"); revealObs.unobserve(e.target); }
  }), { threshold: 0.08 });
  document.querySelectorAll(".reveal").forEach((el) => revealObs.observe(el));
  chapObs = new IntersectionObserver((es) => es.forEach((e) => {
    if (!e.isIntersecting) return;
    const c = CHAPTERS.find((x) => x.id === e.target.id);
    $("#chapterNow").innerHTML = c ? t(c.kicker) : "";
    document.querySelectorAll("#rail a").forEach((a) => a.classList.toggle("on", a.dataset.id === e.target.id));
  }), { rootMargin: "-45% 0px -50% 0px" });
  document.querySelectorAll("main section, header.hero").forEach((s) => chapObs.observe(s));
}

/* Mạng nơ-ron ở phần mở đầu: các nút trôi chậm, nối nhau khi đủ gần, bị con trỏ hút nhẹ.
   Hình ảnh này gợi đến mạng kết nối não, chủ đề mình đang học. */
(function network() {
  const cv = $("#net"), ctx = cv.getContext("2d"), hero = $("header.hero");
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let W, H, nodes = [], mouse = null, running = true, dpr = Math.min(devicePixelRatio || 1, 2);
  const color = () => getComputedStyle(document.documentElement).getPropertyValue("--accent").trim();
  function size() {
    W = hero.clientWidth; H = hero.clientHeight;
    cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const n = Math.round(Math.min(90, W * H / 14000));
    nodes = Array.from({ length: n }, () => ({ x: Math.random() * W, y: Math.random() * H,
      vx: (Math.random() - .5) * .3, vy: (Math.random() - .5) * .3, r: 1.2 + Math.random() * 2.2 }));
  }
  function frame() {
    ctx.clearRect(0, 0, W, H);
    const c = color(), D = 130;
    ctx.strokeStyle = c; ctx.fillStyle = c;
    for (const p of nodes) {
      if (!reduce) {
        if (mouse) { const dx = mouse.x - p.x, dy = mouse.y - p.y, d = Math.hypot(dx, dy);
          if (d < 200) { p.vx += dx / d * .02; p.vy += dy / d * .02; } }
        p.vx *= .99; p.vy *= .99; p.x += p.vx; p.y += p.vy;
        if (p.x < 0 || p.x > W) p.vx *= -1;
        if (p.y < 0 || p.y > H) p.vy *= -1;
        const sp = Math.hypot(p.vx, p.vy); if (sp < .12) { p.vx += (Math.random() - .5) * .05; p.vy += (Math.random() - .5) * .05; }
      }
    }
    for (let i = 0; i < nodes.length; i++) for (let j = i + 1; j < nodes.length; j++) {
      const a = nodes[i], b = nodes[j], d = Math.hypot(a.x - b.x, a.y - b.y);
      if (d < D) { ctx.globalAlpha = (1 - d / D) * .35; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke(); }
    }
    for (const p of nodes) {
      const near = mouse && Math.hypot(mouse.x - p.x, mouse.y - p.y) < 120;
      ctx.globalAlpha = near ? .9 : .45; ctx.beginPath(); ctx.arc(p.x, p.y, near ? p.r + 1.5 : p.r, 0, 7); ctx.fill();
    }
    ctx.globalAlpha = 1;
    if (running && !reduce) requestAnimationFrame(frame);
  }
  hero.addEventListener("pointermove", (e) => { const r = hero.getBoundingClientRect(); mouse = { x: e.clientX - r.left, y: e.clientY - r.top }; });
  hero.addEventListener("pointerleave", () => mouse = null);
  addEventListener("resize", () => { size(); if (reduce) frame(); });
  // Tạm dừng khi phần mở đầu khuất khỏi màn hình, đỡ tốn pin
  new IntersectionObserver(([e]) => { const was = running; running = e.isIntersecting; if (running && !was && !reduce) frame(); }).observe(hero);
  size(); frame();
})();
</script>
</body>
</html>
