<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nguyễn Quốc Anh Cường</title>
<meta name="description" content="Nguyen Quoc Anh Cuong: neuroscience & biohealth, research, teaching and the tools I build.">
<meta property="og:title" content="Nguyễn Quốc Anh Cường">
<meta property="og:description" content="From the lab bench to the brain: research, teaching and the tools I build.">
<!-- Font có đủ dấu tiếng Việt; Iowan/Georgia trên máy hiện sai dấu chữ ư, ơ -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f5f1; --card: #ffffff; --text: #1f1f1c; --muted: #6f6d66;
    --line: #e4e2db; --accent: #2f6f5e; --accent-soft: #e2efe9; --warm: #b8673a; --warm-soft: #f6e8de;
    --serif: "Lora", "Times New Roman", serif;
    --sans: "Be Vietnam Pro", -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  :root[data-theme="dark"] {
    --bg: #141412; --card: #1e1d1a; --text: #ecebe6; --muted: #9a988f;
    --line: #302f2a; --accent: #6fbfa6; --accent-soft: #22332d; --warm: #e0976a; --warm-soft: #3a2a20;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141412; --card: #1e1d1a; --text: #ecebe6; --muted: #9a988f;
      --line: #302f2a; --accent: #6fbfa6; --accent-soft: #22332d; --warm: #e0976a; --warm-soft: #3a2a20;
    }
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; scroll-padding-top: 64px; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.65 var(--sans); -webkit-font-smoothing: antialiased; }
  a { color: inherit; }
  .wrap { max-width: 960px; margin: 0 auto; padding: 0 20px; }
  em { font-style: italic; color: var(--accent); }

  /* thanh trên cùng */
  #progress { position: fixed; top: 0; left: 0; height: 3px; width: 0; background: var(--accent); z-index: 30; }
  nav { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--bg) 82%, transparent);
        backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
  nav .wrap { display: flex; align-items: center; gap: 8px; height: 56px; }
  .logo { font: 600 15px var(--mono); text-decoration: none; margin-right: auto; }
  .logo b { color: var(--accent); }
  #chapterNow { font: 13px var(--mono); color: var(--muted); }
  .icon-btn { font: 600 13px var(--mono); color: var(--muted); background: none; border: 1px solid var(--line);
              border-radius: 8px; min-width: 36px; height: 34px; padding: 0 8px; cursor: pointer; }
  .icon-btn:hover { color: var(--text); border-color: var(--accent); }
  @media (max-width: 560px) { #chapterNow { display: none; } }

  /* thanh chương bên phải (desktop) */
  #rail { position: fixed; right: 22px; top: 50%; transform: translateY(-50%); z-index: 15;
          display: flex; flex-direction: column; gap: 14px; }
  #rail a { position: relative; display: block; width: 10px; height: 10px; border-radius: 50%;
            border: 2px solid var(--muted); opacity: .55; transition: .25s; }
  #rail a.on { background: var(--accent); border-color: var(--accent); opacity: 1; transform: scale(1.3); }
  #rail a span { position: absolute; right: 20px; top: 50%; transform: translateY(-50%); white-space: nowrap;
                 font: 12px var(--mono); color: var(--text); background: var(--card); border: 1px solid var(--line);
                 padding: 2px 8px; border-radius: 6px; opacity: 0; pointer-events: none; transition: .2s; }
  #rail a:hover span { opacity: 1; }
  @media (max-width: 1100px) { #rail { display: none; } }

  /* mở đầu */
  header.hero { position: relative; min-height: min(92vh, 820px); display: flex; align-items: center; overflow: hidden;
                border-bottom: 1px solid var(--line); }
  #net { position: absolute; inset: 0; width: 100%; height: 100%; }
  .hero .wrap { position: relative; width: 100%; padding-top: 60px; padding-bottom: 60px; pointer-events: none; }
  .hero .wrap a, .hero .wrap button { pointer-events: auto; }
  .pill { display: inline-flex; align-items: center; gap: 8px; font: 13px var(--mono); color: var(--muted);
          border: 1px solid var(--line); border-radius: 99px; padding: 4px 12px; background: var(--card); }
  .pill i { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); animation: pulse 2s infinite; }
  @keyframes pulse { 50% { opacity: .3; } }
  h1 { font: 400 clamp(42px, 8vw, 88px)/1 var(--serif); letter-spacing: -.025em; margin: 22px 0 0; }
  h1 small { display: block; font: 400 clamp(16px, 2vw, 20px) var(--mono); color: var(--muted); letter-spacing: 0; margin-bottom: 14px; }
  .lead { font: 400 clamp(19px, 2.4vw, 24px)/1.45 var(--serif); max-width: 640px; margin: 24px 0 0; }
  .interests { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 26px; }
  .interests span { font-size: 14px; background: var(--card); border: 1px solid var(--line); border-radius: 99px; padding: 5px 14px; }
  .cta { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 30px; }
  .btn { display: inline-flex; align-items: center; gap: 8px; text-decoration: none; font: 500 15px var(--sans);
         padding: 10px 18px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--text); cursor: pointer; }
  .btn:hover { border-color: var(--accent); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--bg); }
  .scroll-hint { position: absolute; bottom: 22px; left: 50%; transform: translateX(-50%); font: 12px var(--mono);
                 color: var(--muted); animation: bob 2s infinite; }
  @keyframes bob { 50% { transform: translate(-50%, 6px); } }

  /* chương */
  section { padding: 84px 0; border-bottom: 1px solid var(--line); }
  .kicker { font: 13px var(--mono); color: var(--accent); letter-spacing: .05em; text-transform: uppercase; }
  h2 { font: 400 clamp(30px, 4.5vw, 44px)/1.1 var(--serif); margin: 8px 0 12px; letter-spacing: -.015em; }
  .intro { color: var(--muted); font-size: 17px; max-width: 620px; margin: 0 0 36px; }
  .next { display: inline-flex; gap: 10px; align-items: baseline; margin-top: 44px; text-decoration: none;
          color: var(--muted); font: 14px var(--mono); }
  .next b { font: 400 22px var(--serif); color: var(--text); }
  .next:hover b { color: var(--accent); }

  /* tiểu sử */
  .bio-lead { font: 400 clamp(20px, 2.6vw, 26px)/1.45 var(--serif); max-width: 760px; margin: 0 0 40px; }
  .about { display: grid; grid-template-columns: 1.5fr 1fr; gap: 44px; }
  .story { list-style: none; margin: 0; padding: 0; counter-reset: s; }
  .story li { counter-increment: s; display: grid; grid-template-columns: 46px 1fr; gap: 4px 10px; padding: 0 0 26px; position: relative; }
  .story li::before { content: counter(s); grid-row: span 2; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center;
                      font: 400 17px var(--serif); color: var(--accent); background: var(--accent-soft); z-index: 1; }
  .story li:not(:last-child)::after { content: ""; position: absolute; left: 16px; top: 34px; bottom: 0; width: 2px; background: var(--line); }
  .story h4 { margin: 4px 0 0; font: 600 17px var(--sans); }
  .story p { margin: 0; grid-column: 2; color: var(--muted); font-size: 16px; }
  .side { display: grid; gap: 16px; align-self: start; }
  .goal { background: var(--accent); color: var(--bg); border-radius: 14px; padding: 18px; }
  .goal small { display: block; font: 12px var(--mono); opacity: .8; text-transform: uppercase; letter-spacing: .05em; margin-bottom: 6px; }
  .goal p { margin: 0; font: 400 18px/1.45 var(--serif); }
  .facts { list-style: none; margin: 0; padding: 0; border: 1px solid var(--line); border-radius: 14px; background: var(--card); }
  .facts li { padding: 12px 16px; border-top: 1px solid var(--line); font-size: 15px; }
  .facts li:first-child { border-top: none; }
  .facts small { display: block; font: 12px var(--mono); color: var(--muted); }
  @media (max-width: 720px) { .about { grid-template-columns: 1fr; gap: 20px; } }

  /* hành trình: timeline ngang */
  .hline { display: flex; overflow-x: auto; scroll-snap-type: x proximity; padding: 4px 2px 16px; scrollbar-width: thin; }
  .step { flex: 1 0 150px; display: flex; flex-direction: column; align-items: stretch; justify-content: flex-start;
          text-align: left; background: none; border: 0; font: inherit; color: inherit; cursor: pointer;
          padding: 0 14px 0 0; scroll-snap-align: start; opacity: .62; transition: opacity .2s; }
  .step:hover, .step[aria-selected="true"] { opacity: 1; }
  .step time { display: block; font: 12px var(--mono); color: var(--muted); margin-bottom: 10px; white-space: nowrap; }
  .step .rail { display: block; position: relative; height: 16px; margin: 0 -14px 12px 0; }
  .step .rail::before { content: ""; position: absolute; left: 0; right: 0; top: 7px; border-top: 2px solid var(--dot); opacity: .45; }
  .step.upnext .rail::before { border-top-style: dashed; }
  .step:last-child .rail::before { right: 50%; }
  .step .rail i { position: absolute; left: 0; top: 0; width: 16px; height: 16px; border-radius: 50%; background: var(--bg);
                  border: 3px solid var(--dot); transition: transform .2s, background .2s; }
  .step[aria-selected="true"] .rail i { background: var(--dot); transform: scale(1.25); }
  .step.now .rail i { box-shadow: 0 0 0 0 var(--dot); animation: ring 2s infinite; }
  @keyframes ring { 70% { box-shadow: 0 0 0 9px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }
  .step b { display: block; font: 600 15px/1.35 var(--sans); }
  .step small { display: block; color: var(--muted); font-size: 13px; line-height: 1.4; margin-top: 2px; }
  .step-detail { background: var(--card); border: 1px solid var(--line); border-left: 4px solid var(--dot); border-radius: 14px; padding: 20px 22px; margin-top: 8px; }
  .step-detail .kind { font: 12px var(--mono); color: var(--dot); text-transform: uppercase; letter-spacing: .05em; }
  .step-detail h4 { margin: 4px 0 2px; font: 400 24px/1.2 var(--serif); }
  .step-detail .org { color: var(--muted); font-size: 15px; }
  .step-detail ul { margin: 12px 0 0; padding-left: 18px; font-size: 15px; }
  .step-detail li { margin-bottom: 4px; }
  .step-nav { display: flex; justify-content: space-between; margin-top: 14px; }
  .step-nav button { font: 13px var(--mono); color: var(--muted); background: none; border: 0; cursor: pointer; padding: 4px 0; }
  .step-nav button:hover:not(:disabled) { color: var(--accent); }
  .step-nav button:disabled { opacity: .3; cursor: default; }
  .alongside { display: grid; grid-template-columns: repeat(2, 1fr); gap: 4px 28px; margin: 0; padding: 0; list-style: none; }
  .alongside li { display: grid; grid-template-columns: 96px 1fr; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); font-size: 14px; }
  .alongside time { font: 12px var(--mono); color: var(--muted); padding-top: 2px; }
  @media (max-width: 720px) { .alongside { grid-template-columns: 1fr; } }
  @media (prefers-reduced-motion: reduce) { .step.now .rail i { animation: none; } }

  /* thư mục bài giảng (kiểu Drive) */
  .drive { display: grid; grid-template-columns: 230px 1fr; background: var(--card); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; min-height: 300px; }
  .drive-side { border-right: 1px solid var(--line); padding: 12px; display: flex; flex-direction: column; gap: 4px; background: color-mix(in srgb, var(--bg) 55%, var(--card)); }
  .folder { display: grid; grid-template-columns: 30px 1fr; gap: 0 8px; align-items: center; text-align: left; font: inherit; color: inherit;
            background: none; border: 0; border-radius: 10px; padding: 10px; cursor: pointer; }
  .folder:hover { background: var(--accent-soft); }
  .folder[aria-pressed="true"] { background: var(--accent); color: var(--bg); }
  .folder .fi { font-size: 22px; grid-row: span 2; }
  .folder b { font: 600 15px var(--sans); }
  .folder small { font: 12px var(--mono); opacity: .75; }
  .drive-main { padding: 16px 20px 20px; min-width: 0; }
  .crumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font: 13px var(--mono); color: var(--muted); margin-bottom: 6px; }
  .crumbs button { font: inherit; color: var(--accent); background: none; border: 0; padding: 0; cursor: pointer; }
  .crumbs button:hover { text-decoration: underline; }
  .drive-main h4 { margin: 0 0 4px; font: 400 24px/1.2 var(--serif); }
  .drive-desc { margin: 0 0 14px; color: var(--muted); font-size: 15px; }
  .rows { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
  .rows li { border-bottom: 1px solid var(--line); }
  .row { display: grid; grid-template-columns: 30px 1fr auto 18px; gap: 10px; align-items: center; width: 100%; text-align: left; font: inherit; color: inherit;
         background: none; border: 0; padding: 11px 4px; cursor: pointer; text-decoration: none; border-radius: 8px; }
  .row:hover { background: var(--accent-soft); }
  .row .ri { font-size: 20px; text-align: center; }
  .row .rn b { display: block; font: 500 15px/1.35 var(--sans); }
  .row .rn small { color: var(--muted); font-size: 13px; }
  .row .rm { font: 12px var(--mono); color: var(--muted); white-space: nowrap; }
  .row .rg { color: var(--muted); }
  .row.ghost { cursor: default; color: var(--muted); font-size: 14px; grid-template-columns: 30px 1fr; }
  .row.ghost:hover { background: none; }
  @media (max-width: 720px) {
    .drive { grid-template-columns: 1fr; }
    .drive-side { flex-direction: row; border-right: 0; border-bottom: 1px solid var(--line); overflow-x: auto; }
    .folder { flex: 1 0 auto; }
    .row { grid-template-columns: 26px 1fr 18px; } .row .rm { display: none; }
  }

  /* nghiên cứu */
  .cols3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 40px; }
  @media (max-width: 720px) { .cols3 { grid-template-columns: 1fr; } }
  .interest { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 20px; }
  .interest .n { font: 400 36px/1 var(--serif); color: var(--accent); }
  .interest p { margin: 10px 0 0; font-size: 15px; }
  h3.sub { font: 13px var(--mono); color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin: 0 0 14px; }
  .posters { list-style: none; margin: 0 0 36px; padding: 0; counter-reset: p; }
  .posters li { counter-increment: p; display: grid; grid-template-columns: 44px 1fr; gap: 6px; padding: 16px 0; border-top: 1px solid var(--line); }
  .posters li::before { content: "0" counter(p); font: 400 22px var(--serif); color: var(--muted); }
  .posters b { display: block; font-weight: 600; }
  .posters span { color: var(--muted); font-size: 14px; }
  .award { display: inline-block; margin-top: 6px; font: 12px var(--mono); color: var(--warm); background: var(--warm-soft); padding: 2px 8px; border-radius: 6px; }
  .studies { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  @media (max-width: 720px) { .studies { grid-template-columns: 1fr; } }
  .study { border-left: 3px solid var(--accent); padding: 4px 0 4px 14px; font-size: 15px; }

  /* tác phẩm (artifact) */
  .works { display: grid; grid-template-columns: repeat(2, 1fr); gap: 18px; }
  @media (max-width: 720px) { .works { grid-template-columns: 1fr; } }
  .work { background: var(--card); border: 1px solid var(--line); border-radius: 16px; overflow: hidden;
          display: flex; flex-direction: column; transition: transform .25s, box-shadow .25s, border-color .25s; }
  .work:hover { transform: translateY(-4px); border-color: var(--accent); box-shadow: 0 14px 34px -22px var(--accent); }
  .cover { height: 132px; position: relative; display: flex; align-items: flex-end; padding: 14px 18px;
           background: var(--cover); color: #fff; }
  .cover .big { position: absolute; right: 14px; top: 6px; font-size: 64px; opacity: .9; filter: saturate(.9); }
  .cover .who { font: 12px var(--mono); background: rgba(0,0,0,.25); padding: 2px 8px; border-radius: 6px; }
  .work .body { padding: 18px; flex: 1; display: flex; flex-direction: column; }
  .work h4 { margin: 0 0 6px; font: 600 18px var(--sans); }
  .work p { margin: 0 0 14px; color: var(--muted); font-size: 15px; }
  .items { list-style: none; margin: auto 0 0; padding: 0; border-top: 1px solid var(--line); }
  .items li { border-bottom: 1px solid var(--line); }
  .items li:last-child { border-bottom: none; }
  .items a, .items span.row { display: flex; align-items: center; gap: 10px; padding: 9px 2px; text-decoration: none; font-size: 15px; }
  .items a:hover { color: var(--accent); }
  .items .type { font: 11px var(--mono); color: var(--accent); background: var(--accent-soft); padding: 1px 7px; border-radius: 5px; min-width: 64px; text-align: center; }
  .items .go { margin-left: auto; color: var(--muted); }
  .items span.row { color: var(--muted); }
  .video { aspect-ratio: 16/9; width: 100%; border: 0; display: block; }
  .note { font-size: 13px; color: var(--muted); margin-top: 18px; }

  /* học code */
  .muted { color: var(--muted); font-size: 15px; }
  .courses { display: grid; gap: 12px; }
  .course { background: var(--card); border: 1px solid var(--line); border-radius: 14px; transition: border-color .2s; }
  .course:hover, .course[open] { border-color: var(--accent); }
  .course summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: 44px 1fr auto; gap: 14px; align-items: center; padding: 16px 18px; }
  .course summary::-webkit-details-marker { display: none; }
  .ci { font-size: 28px; }
  .ct b { display: block; font-weight: 600; }
  .ct small { display: block; color: var(--muted); font-size: 14px; line-height: 1.5; }
  .cm { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; text-align: right; }
  .badge { font: 12px var(--mono); color: var(--accent); background: var(--accent-soft); padding: 2px 8px; border-radius: 6px; white-space: nowrap; }
  .ago { font: 12px var(--mono); color: var(--muted); text-transform: none; letter-spacing: 0; }
  .nb { list-style: none; margin: 0 18px; padding: 0; border-top: 1px solid var(--line); }
  .nb a { display: flex; gap: 10px; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--line); text-decoration: none; font-size: 15px; }
  .nb a:hover { color: var(--accent); }
  .nb .type, .items .type { font: 11px var(--mono); color: var(--accent); background: var(--accent-soft); padding: 1px 7px; border-radius: 5px; min-width: 64px; text-align: center; }
  .nb .go { margin-left: auto; color: var(--muted); }
  .repo-link { display: inline-block; margin: 10px 18px 16px; font: 12px var(--mono); color: var(--muted); text-decoration: none; word-break: break-all; }
  .repo-link:hover { color: var(--accent); }
  @media (max-width: 560px) {
    .course summary { grid-template-columns: 34px 1fr; }
    .cm { grid-column: 2; align-items: flex-start; flex-direction: row; flex-wrap: wrap; gap: 8px; }
  }
  .tools { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  @media (max-width: 860px) { .tools { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 560px) { .tools { grid-template-columns: 1fr; } }
  .tool { background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; display: flex; flex-direction: column;
          transition: transform .25s, border-color .25s; }
  .tool:hover { transform: translateY(-3px); border-color: var(--accent); }
  /* khung xem trước: trang thật thu nhỏ còn 1/4, không bấm được */
  .shot { position: relative; aspect-ratio: 16 / 10; overflow: hidden; background: var(--bg); border-bottom: 1px solid var(--line); }
  .shot::before { content: "● ● ●"; position: absolute; z-index: 1; top: 0; left: 0; right: 0; height: 18px; padding-left: 8px;
                  font-size: 7px; line-height: 18px; letter-spacing: 2px; color: var(--muted); background: var(--card); border-bottom: 1px solid var(--line); }
  .shot iframe { position: absolute; top: 18px; left: 0; width: 400%; height: 400%; border: 0; transform: scale(.25); transform-origin: 0 0; pointer-events: none; }
  .shot-ph { position: absolute; inset: 18px 0 0; display: grid; place-items: center; font: 400 28px var(--serif); color: var(--accent); background: var(--accent-soft); }
  .tool-body { padding: 16px; display: flex; flex-direction: column; flex: 1; }
  .tool h4 { margin: 0 0 4px; font: 600 17px var(--sans); }
  .tool p { margin: 0 0 12px; color: var(--muted); font-size: 14px; }
  .tool-links { display: flex; gap: 16px; margin-top: auto; padding-top: 14px; font-size: 14px; }
  .tool-links a { text-decoration: none; color: var(--accent); }
  .tool-links a:hover { text-decoration: underline; }
  .live { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px; }
  .gh-stats { display: flex; gap: 32px; margin-bottom: 12px; }
  .gh-stats b { display: block; font: 400 26px/1.1 var(--serif); }
  .gh-stats span { font-size: 13px; color: var(--muted); }
  .commits { list-style: none; margin: 0; padding: 0; }
  .commits a { display: grid; grid-template-columns: 70px 1fr auto; gap: 12px; align-items: baseline; padding: 8px 0;
               border-top: 1px solid var(--line); text-decoration: none; font-size: 14px; }
  .commits a:hover span { color: var(--accent); }
  .commits code { font: 12px var(--mono); color: var(--accent); }

function ago(iso) {
  if (!iso) return "";
  const s = (new Date(iso) - Date.now()) / 1000, rtf = new Intl.RelativeTimeFormat(lang, { numeric: "auto" });
  for (const [u, n] of [["year", 31536000], ["month", 2592000], ["day", 86400], ["hour", 3600], ["minute", 60]])
    if (Math.abs(s) >= n) return rtf.format(Math.round(s / n), u);
  return rtf.format(0, "minute");
}

// Gọi GitHub API công khai (không cần token, giới hạn 60 lần/giờ cho mỗi người xem),
// lưu tạm 30 phút để mỗi lần tải lại trang không phải gọi lại.
async function loadGitHub() {
  const KEY = "portfolio-gh";
  let cached = null; try { cached = JSON.parse(store.get(KEY)); } catch {}
  if (cached && Date.now() - cached.at < 30 * 60 * 1000) { gh = cached.data; return paintGitHub(); }
  try {
    const [repos, commits] = await Promise.all([
      fetch(`https://api.github.com/users/${ME.github}/repos?per_page=100`).then((r) => r.ok ? r.json() : Promise.reject(r.status)),
      fetch(`https://api.github.com/repos/${ME.github}/${REPO}/commits?per_page=6`).then((r) => r.ok ? r.json() : Promise.reject(r.status)),
    ]);
    gh = { state: "ok", count: repos.length,
      repos: Object.fromEntries(repos.map((r) => [r.name, r.pushed_at])),
      commits: commits.map((c) => ({ sha: c.sha.slice(0, 7), msg: c.commit.message.split("\n")[0], date: c.commit.author.date, url: c.html_url })) };
    store.set(KEY, JSON.stringify({ at: Date.now(), data: gh }));
  } catch { gh = { ...gh, state: "fail" }; }
  paintGitHub();
}
function paintGitHub() {
  const live = $("#ghLive"); if (live) live.innerHTML = liveHTML();
  document.querySelectorAll(".ago[data-repo]").forEach((el) => el.innerHTML = repoMeta(el.dataset.repo));
}

  $("#interests").innerHTML = ME.interests.map((x) => `<span>${t(x)}</span>`).join("");
  $("#langBtn").textContent = lang === "vi" ? "EN" : "VI";
  $("#chapters").innerHTML = CHAPTERS.map((c, i) => {
    const nx = CHAPTERS[i + 1];
    return `<section id="${c.id}" class="${c.id === "contact" ? "contact" : ""}"><div class="wrap reveal">
      <div class="kicker">${t(c.kicker)}</div><h2>${t(c.title)}</h2>
      ${c.intro ? `<p class="intro">${t(c.intro)}</p>` : ""}
      ${chapterBody(c.id)}
      ${nx ? `<div><a class="next" href="#${nx.id}">${t(UI.next)} → <b>${t(nx.title)}</b></a></div>` : ""}
    </div></section>`;
  }).join("");
  $("#rail").innerHTML = CHAPTERS.map((c) => `<a href="#${c.id}" data-id="${c.id}"><span>${t(c.kicker)}</span></a>`).join("");
  observe();
}

// Bấm trên timeline và trong thư mục (gắn một lần ở document, vì nội dung được vẽ lại khi đổi ngôn ngữ)
document.addEventListener("click", (e) => {
  const step = e.target.closest("[data-step]");
  if (step && !step.disabled) return selectStep(+step.dataset.step);
  const folder = e.target.closest("[data-folder]"), unit = e.target.closest("[data-unit]");
  if (folder) fx = { folder: +folder.dataset.folder, unit: null };
  else if (unit) fx.unit = unit.dataset.unit === "up" ? null : +unit.dataset.unit;
  else return;
  $("#drive").innerHTML = driveHTML();
});

// Hiện dần + đánh dấu chương đang đọc
let revealObs, chapObs;
function observe() {
  revealObs?.disconnect(); chapObs?.disconnect();
  revealObs = new IntersectionObserver((es) => es.forEach((e) => {
    if (e.isIntersecting) { e.target.classList.add("in"); revealObs.unobserve(e.target); }
  }), { threshold: 0.08 });
  document.querySelectorAll(".reveal").forEach((el) => revealObs.observe(el));
  chapObs = new IntersectionObserver((es) => es.forEach((e) => {
    if (!e.isIntersecting) return;
    const c = CHAPTERS.find((x) => x.id === e.target.id);
    $("#chapterNow").innerHTML = c ? t(c.kicker) : "";
    document.querySelectorAll("#rail a").forEach((a) => a.classList.toggle("on", a.dataset.id === e.target.id));
  }), { rootMargin: "-45% 0px -50% 0px" });
  document.querySelectorAll("main section, header.hero").forEach((s) => chapObs.observe(s));
}

// Ngôn ngữ, giao diện, chia sẻ
$("#langBtn").onclick = () => { lang = lang === "vi" ? "en" : "vi"; store.set("portfolio-lang", lang); render();
  document.querySelectorAll(".reveal").forEach((el) => el.classList.add("in")); };
let theme = store.get("portfolio-theme") || "auto";
const applyTheme = () => theme === "auto" ? document.documentElement.removeAttribute("data-theme")
                                          : document.documentElement.setAttribute("data-theme", theme);
applyTheme();
$("#themeBtn").onclick = () => { theme = { auto: "light", light: "dark", dark: "auto" }[theme]; store.set("portfolio-theme", theme); applyTheme(); };
const toast = (m) => { const el = $("#toast"); el.textContent = m; el.classList.add("show"); setTimeout(() => el.classList.remove("show"), 1800); };
$("#shareBtn").onclick = async () => {
  try {
    if (navigator.share) await navigator.share({ title: document.title, url: location.href });
    else { await navigator.clipboard.writeText(location.href); toast(UI.copied[lang === "vi" ? 0 : 1]); }
  } catch {}
};
addEventListener("scroll", () => {
  const h = document.documentElement;
  $("#progress").style.width = (h.scrollTop / (h.scrollHeight - h.clientHeight)) * 100 + "%";
}, { passive: true });

render();
loadGitHub();

/* Mạng nơ-ron ở phần mở đầu: các nút trôi chậm, nối nhau khi đủ gần, bị con trỏ hút nhẹ.
   Hình ảnh này gợi đến mạng kết nối não, chủ đề mình đang học. */
(function network() {
  const cv = $("#net"), ctx = cv.getContext("2d"), hero = $("header.hero");
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let W, H, nodes = [], mouse = null, running = true, dpr = Math.min(devicePixelRatio || 1, 2);
  const color = () => getComputedStyle(document.documentElement).getPropertyValue("--accent").trim();
  function size() {
    W = hero.clientWidth; H = hero.clientHeight;
    cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const n = Math.round(Math.min(90, W * H / 14000));
    nodes = Array.from({ length: n }, () => ({ x: Math.random() * W, y: Math.random() * H,
      vx: (Math.random() - .5) * .3, vy: (Math.random() - .5) * .3, r: 1.2 + Math.random() * 2.2 }));
  }
  function frame() {
    ctx.clearRect(0, 0, W, H);
    const c = color(), D = 130;
    ctx.strokeStyle = c; ctx.fillStyle = c;
    for (const p of nodes) {
      if (!reduce) {
        if (mouse) { const dx = mouse.x - p.x, dy = mouse.y - p.y, d = Math.hypot(dx, dy);
          if (d < 200) { p.vx += dx / d * .02; p.vy += dy / d * .02; } }
        p.vx *= .99; p.vy *= .99; p.x += p.vx; p.y += p.vy;
        if (p.x < 0 || p.x > W) p.vx *= -1;
        if (p.y < 0 || p.y > H) p.vy *= -1;
        const sp = Math.hypot(p.vx, p.vy); if (sp < .12) { p.vx += (Math.random() - .5) * .05; p.vy += (Math.random() - .5) * .05; }
      }
    }
    for (let i = 0; i < nodes.length; i++) for (let j = i + 1; j < nodes.length; j++) {
      const a = nodes[i], b = nodes[j], d = Math.hypot(a.x - b.x, a.y - b.y);
      if (d < D) { ctx.globalAlpha = (1 - d / D) * .35; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke(); }
    }
    for (const p of nodes) {
      const near = mouse && Math.hypot(mouse.x - p.x, mouse.y - p.y) < 120;
      ctx.globalAlpha = near ? .9 : .45; ctx.beginPath(); ctx.arc(p.x, p.y, near ? p.r + 1.5 : p.r, 0, 7); ctx.fill();
    }
    ctx.globalAlpha = 1;
    if (running && !reduce) requestAnimationFrame(frame);
  }
  hero.addEventListener("pointermove", (e) => { const r = hero.getBoundingClientRect(); mouse = { x: e.clientX - r.left, y: e.clientY - r.top }; });
  hero.addEventListener("pointerleave", () => mouse = null);
  addEventListener("resize", () => { size(); if (reduce) frame(); });
  // Tạm dừng khi phần mở đầu khuất khỏi màn hình, đỡ tốn pin
  new IntersectionObserver(([e]) => { const was = running; running = e.isIntersecting; if (running && !was && !reduce) frame(); }).observe(hero);
  size(); frame();
})();
</script>
